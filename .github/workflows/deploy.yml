name: Deploy to Vercel Production

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Usamos la acción oficial de pnpm (más rápido y limpio)
      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10 # O la versión específica que uses en local

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x # Forzamos a que use la última revisión de Node 20
          cache: 'pnpm'

      - name: Instalar dependencias del proyecto
        run: pnpm install --frozen-lockfile

      - name: Instalar Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Descargar información del entorno de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Compilar el proyecto Qwik
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Desplegar en Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}